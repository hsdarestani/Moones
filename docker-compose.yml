services:
  app:
    build: .
    container_name: mones-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-mones}
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - postgres
      - redis
      - gateway
    volumes:
      - routing_diagnostics:/diagnostics
      - /etc/nginx:/host/etc/nginx:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  gateway:
    build: .
    container_name: mones-gateway
    restart: unless-stopped
    entrypoint: ["sh", "-c", "python /app/scripts/nginx_route_repair.py; exec python /app/scripts/port_gateway.py"]
    environment:
      MOONES_UPSTREAM_HOST: "127.0.0.1"
      MOONES_UPSTREAM_PORT: "18000"
      MOONES_GATEWAY_RECOVERY_REV: "2026-08-27-7-auto-backend"
    network_mode: host
    pid: host
    cap_add:
      - KILL
    volumes:
      - /etc/nginx:/host/etc/nginx:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - routing_diagnostics:/diagnostics

  postgres:
    image: postgres:16-alpine
    container_name: mones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mones}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mones-redis
    restart: unless-stopped

volumes:
  postgres_data:
  routing_diagnostics:
