name: Fix stale image job denial

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stale-image-job-denial-and-log
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/patch_stale_image_job_denial.py
      - name: Compile and test
        run: |
          python -m py_compile app/api/telegram.py app/services/image_generation_service.py app/services/image_pipeline_v2.py
          pytest -q tests/test_nude_anatomy_profile_migration.py tests/test_issue_180_image_failure_retry.py tests/test_semantic_image_intent_router.py
          git diff --check
      - name: Commit product changes
        run: |
          rm -f .github/scripts/patch_stale_image_job_denial.py
          rm -f .github/workflows/fix-stale-image-job-denial.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app tests .github
          git commit -m "Fix stale image job denial and log exact reasons"
          git push origin HEAD:agent/fix-stale-image-job-denial-and-log
