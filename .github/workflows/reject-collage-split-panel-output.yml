name: Reject collage split-panel output

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-collage-split-panel-output
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply product patch
        run: |
          python .github/scripts/patch_reject_collage_split_panel.py
          # Downsampling reduces a narrow separator's absolute edge strength.
          # Seven grayscale levels still requires a >3.2x local edge ratio plus
          # high panel correlation and low panel MAD, so the detector stays strict.
          sed -i "s/seam >= 18.0/seam >= 7.0/" app/services/generated_image_qa_service.py
      - name: Compile and test collage rejection contract
        run: |
          python -m py_compile \
            app/services/generated_image_qa_service.py \
            app/services/image_pipeline_v2.py
          pytest -q \
            tests/test_split_panel_collage_rejection.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_krea_adult_generation_plan.py \
            tests/test_adult_generation_policy_contract.py \
            tests/test_nude_anatomy_profile_migration.py \
            tests/test_live_gate_uses_production_reviewer_pool.py
          git diff --check
      - name: Commit permanent product changes
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/scripts/patch_reject_collage_split_panel.py
          rm -f .github/workflows/reject-collage-split-panel-output.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/services/generated_image_qa_service.py \
            app/services/image_pipeline_v2.py \
            tests/test_split_panel_collage_rejection.py
          git commit -m "Reject collage and split-panel generated images"
          git push origin HEAD:agent/reject-collage-split-panel-output
