name: Enforce independent reviewer order

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enforce-independent-reviewer-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/patch_enforce_reviewer_order.py
      - name: Compile and run reviewer regressions
        run: |
          python -m py_compile app/services/generated_image_qa_service.py
          pytest -q \
            tests/test_enforced_reviewer_order.py \
            tests/test_independent_vision_reviewer_pool.py \
            tests/test_vision_response_format_fallback.py
          git diff --check
      - name: Commit permanent changes
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/scripts/patch_enforce_reviewer_order.py
          rm -f .github/workflows/enforce-independent-reviewer-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/generated_image_qa_service.py tests/test_enforced_reviewer_order.py
          git commit -m "Enforce independent Vision reviewer order"
          git push origin HEAD:agent/enforce-independent-reviewer-order
