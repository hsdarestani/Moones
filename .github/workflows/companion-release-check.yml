name: Companion release connectivity

on:
  push:
    branches: ["ops/companion-release-check"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Inspect only configured access names, routing and connectivity
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SHARED_VPS_PASS: ${{ secrets.SHARED_VPS_PASS }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          VENICE_API_KEY_STAGING: ${{ secrets.VENICE_API_KEY_STAGING }}
        run: python -m scripts.check_release_connectivity
      - run: python -m pip install -r requirements.txt
      - name: One real synthetic chat request (authorized release smoke, $0.02 guard)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY || secrets.VENICE_API_KEY_STAGING }}
        run: |
          if [ -z "$VENICE_API_KEY" ]; then
            echo 'RELEASE_PROVIDER_CHECK=NO_CONFIGURED_KEY'
            exit 1
          fi
          python -m scripts.evaluate_companion_models --live --accept-provider-cost --model qwen-3-6-plus --max-calls 1 --max-usd .02 --out artifacts/release-provider-check.json
          python - <<'PY'
          import json
          report=json.load(open('artifacts/release-provider-check.json'))
          print(json.dumps(report,ensure_ascii=False))
          assert len(report['rows']) == 1 and not report['rows'][0]['error'] and report['rows'][0]['answer'].strip(), 'Provider smoke did not produce a usable answer'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-provider-check
          path: artifacts/release-provider-check.json
          if-no-files-found: ignore
