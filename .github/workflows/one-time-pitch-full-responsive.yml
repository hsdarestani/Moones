name: One-time pitch full responsive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-pitch-full-responsive.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply responsive pitch patch
        run: python scripts/one_time_pitch_responsive.py
      - name: Commit result and remove temporary files
        run: |
          rm -f .github/workflows/one-time-pitch-full-responsive.yml
          rm -f scripts/one_time_pitch_responsive.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make pitch deck fully responsive and remove founder slide"
          git push origin HEAD:main
