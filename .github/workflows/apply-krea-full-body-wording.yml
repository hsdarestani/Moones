name: Apply Krea full body wording

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-krea-adult-image-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply and test correction wording
        run: |
          python .github/scripts/patch_krea_full_body_wording.py
          pytest -q tests/test_image_generation_jobs.py::test_full_body_headshot_qa_metadata_blocks_delivery_status_sent tests/test_krea_adult_generation_plan.py::test_full_body_correction_is_composition_specific
          git diff --check
      - name: Commit product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/generated_image_qa_service.py
          git commit -m "Preserve explicit full-body correction wording"
          git push origin HEAD:agent/rebuild-krea-adult-image-delivery
