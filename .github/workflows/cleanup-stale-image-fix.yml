name: Cleanup stale image fix branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stale-image-job-denial-and-log
          fetch-depth: 0
      - name: Remove generated bytecode and workflow
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find app tests -type f -name '*.pyc' -delete
          rm -f .github/workflows/cleanup-stale-image-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Remove generated bytecode from image fix"
          git push origin HEAD:agent/fix-stale-image-job-denial-and-log
