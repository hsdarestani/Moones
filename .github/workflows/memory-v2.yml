name: Memory V2 tests

on:
  pull_request:
    paths:
      - "app/memory/episodic_context.py"
      - "app/memory/semantic_retrieval.py"
      - "app/models/memory_embedding.py"
      - "migrations/versions/0043_memory_semantic_index.py"
      - "tests/test_semantic_memory_v2.py"
      - "scripts/index_memory_embeddings.py"
      - "scripts/verify_memory_schema.py"
      - "app/memory/temporal_store.py"
      - "app/models/temporal_memory.py"
      - "migrations/versions/0042_temporal_memory_v2.py"
      - "tests/test_temporal_memory_v2.py"
      - "app/engine/simple_chat.py"
      - "app/engine/orchestrator.py"
      - "tests/test_episodic_context_v2.py"
      - ".github/workflows/memory-v2.yml"
  push:
    branches: ["feature/episodic-memory-v2"]

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app/memory/episodic_context.py app/memory/semantic_retrieval.py app/models/memory_embedding.py migrations/versions/0043_memory_semantic_index.py scripts/index_memory_embeddings.py scripts/verify_memory_schema.py app/memory/temporal_store.py app/models/temporal_memory.py migrations/versions/0042_temporal_memory_v2.py app/engine/simple_chat.py app/engine/orchestrator.py
      - name: Memory V2 unit tests (no server)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m pytest -q tests/test_episodic_context_v2.py tests/test_temporal_memory_v2.py tests/test_semantic_memory_v2.py

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mones_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mones_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DB_USER: postgres
      DB_PASSWORD: test-only
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: mones_test
      DATABASE_URL: 'postgresql+psycopg://postgres:test-only@localhost:5432/mones_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Alembic head
        run: |
          python -m alembic heads
          test "$(python -m alembic heads | wc -l)" -eq 1
      - name: Migrate clean isolated PostgreSQL
        run: python -m alembic upgrade head
      - name: Validate schema and deletion constraints
        run: python -m scripts.verify_memory_schema
