name: Memory V2 tests

on:
  pull_request:
    paths:
      - "app/memory/episodic_context.py"
      - "app/memory/temporal_store.py"
      - "app/models/temporal_memory.py"
      - "migrations/versions/0042_temporal_memory_v2.py"
      - "tests/test_temporal_memory_v2.py"
      - "app/engine/simple_chat.py"
      - "app/engine/orchestrator.py"
      - "tests/test_episodic_context_v2.py"
      - ".github/workflows/memory-v2.yml"
  push:
    branches: ["feature/episodic-memory-v2"]

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app/memory/episodic_context.py app/memory/temporal_store.py app/models/temporal_memory.py migrations/versions/0042_temporal_memory_v2.py app/engine/simple_chat.py app/engine/orchestrator.py
      - name: Memory V2 unit tests (no server)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m pytest -q tests/test_episodic_context_v2.py tests/test_temporal_memory_v2.py
