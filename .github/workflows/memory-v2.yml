name: Memory V2 tests

on:
  pull_request:
    paths:
      - "app/memory/episodic_context.py"
      - "app/memory/embedding_pricing.py"
      - "migrations/versions/0045_embedding_pricing_audit.py"
      - "tests/test_embedding_pricing_v2.py"
      - "scripts/audit_account_erasure.py"
      - "app/memory/privacy_controls.py"
      - "app/models/memory_privacy.py"
      - "migrations/versions/0044_memory_privacy_usage.py"
      - "tests/test_memory_privacy_v2.py"
      - "app/api/telegram.py"
      - "app/memory/semantic_retrieval.py"
      - "app/models/memory_embedding.py"
      - "migrations/versions/0043_memory_semantic_index.py"
      - "tests/test_semantic_memory_v2.py"
      - "scripts/index_memory_embeddings.py"
      - "scripts/benchmark_memory_v2.py"
      - "scripts/benchmark_memory_140.py"
      - "scripts/evaluate_memory_answers.py"
      - "tests/test_memory_answer_evaluation.py"
      - "tests/test_memory_benchmark_140.py"
      - "migrations/versions/0003_wallet_subscription_usage.py"
      - "scripts/verify_memory_schema.py"
      - "app/memory/temporal_store.py"
      - "app/models/temporal_memory.py"
      - "migrations/versions/0042_temporal_memory_v2.py"
      - "tests/test_temporal_memory_v2.py"
      - "app/engine/compact_persona_prompt.py"
      - "scripts/benchmark_compact_persona.py"
      - "tests/test_compact_persona_v2.py"
      - "scripts/evaluate_memory_answers.py"
      - "tests/test_memory_answer_evaluation.py"
      - "app/engine/simple_chat.py"
      - "app/engine/orchestrator.py"
      - "tests/test_episodic_context_v2.py"
      - ".github/workflows/memory-v2.yml"
  push:
    branches: ["feature/episodic-memory-v2"]

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app/api/telegram.py app/memory/embedding_pricing.py scripts/audit_account_erasure.py migrations/versions/0045_embedding_pricing_audit.py app/memory/privacy_controls.py app/models/memory_privacy.py migrations/versions/0044_memory_privacy_usage.py app/memory/episodic_context.py app/memory/semantic_retrieval.py app/models/memory_embedding.py migrations/versions/0043_memory_semantic_index.py scripts/index_memory_embeddings.py scripts/evaluate_memory_answers.py scripts/benchmark_memory_140.py scripts/verify_memory_schema.py app/memory/temporal_store.py app/models/temporal_memory.py migrations/versions/0042_temporal_memory_v2.py app/engine/compact_persona_prompt.py scripts/benchmark_compact_persona.py scripts/evaluate_memory_answers.py app/engine/simple_chat.py app/engine/orchestrator.py
      - name: Synthetic memory benchmark (no user data)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m scripts.benchmark_memory_v2
      - name: Persian 140-case benchmark (synthetic)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          mkdir -p artifacts
          python -m scripts.benchmark_memory_140 --out-json artifacts/memory-140.json --out-md artifacts/memory-140.md
      - name: Upload synthetic benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: memory-140-synthetic-report
          path: |
            artifacts/memory-140.*
            artifacts/answer-preflight.json
            artifacts/compact-persona-benchmark.json
            artifacts/persona-preflight.json
          if-no-files-found: error
          retention-days: 30
      - name: Actual production-prompt evaluation preflight (zero API cost)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          VENICE_API_KEY: ''
        run: |
          python -m scripts.evaluate_memory_answers --out artifacts/answer-preflight.json
      - name: Compact Persona full-prompt A/B (no API, synthetic)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          MONES_COMPACT_PERSONA_ENABLED: 'false'
          MONES_COMPACT_PERSONA_SHADOW: 'false'
        run: |
          python -m scripts.benchmark_compact_persona --out artifacts/compact-persona-benchmark.json
          python -m scripts.evaluate_memory_answers --experiment persona --out artifacts/persona-preflight.json
      - name: Memory V2 unit tests (no server)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m pytest -q tests/test_episodic_context_v2.py tests/test_temporal_memory_v2.py tests/test_semantic_memory_v2.py tests/test_memory_privacy_v2.py tests/test_embedding_pricing_v2.py tests/test_memory_benchmark_140.py tests/test_memory_answer_evaluation.py tests/test_compact_persona_v2.py

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mones_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mones_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DB_USER: postgres
      DB_PASSWORD: test-only
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: mones_test
      DATABASE_URL: 'postgresql+psycopg://postgres:test-only@localhost:5432/mones_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Alembic head
        run: |
          python -m alembic heads
          test "$(python -m alembic heads | wc -l)" -eq 1
      - name: Migrate clean isolated PostgreSQL
        run: python -m alembic upgrade head
      - name: Validate schema and deletion constraints
        run: python -m scripts.verify_memory_schema
      - name: Inventory account erasure dependencies (read-only)
        run: python -m scripts.audit_account_erasure
