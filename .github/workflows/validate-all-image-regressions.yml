name: Validate all image regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-krea-adult-image-delivery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run complete image test set
        run: |
          pytest -q \
            tests/test_image*.py \
            tests/test_krea*.py \
            tests/test_lustify*.py \
            tests/test_nude*.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_issue_180_image_failure_retry.py
          git diff --check
