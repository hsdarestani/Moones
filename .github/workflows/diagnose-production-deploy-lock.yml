name: Diagnose production deploy lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose stale deploy lock safely
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/moones_diag"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/moones_diag" "$HOME/.ssh/known_hosts"
      - name: Inspect deploy command process and locks without mutation
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          ssh -i "$HOME/.ssh/moones_diag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -p "$port" "$user@$PROD_HOST" '
            set -u
            echo "DEPLOY_COMMAND=$(command -v deploy 2>/dev/null || true)"
            echo "--- candidate processes ---"
            ps -eo pid=,ppid=,etimes=,stat=,comm=,args= | grep -E "deploy|docker( |$)|pytest|git (fetch|checkout|reset)" | grep -v grep || true
            echo "--- kernel locks ---"
            lslocks 2>/dev/null | grep -Ei "deploy|moones|mones" || true
            echo "--- recent candidate lock files ---"
            find /tmp /run/lock /var/lock -maxdepth 3 -type f \( -iname "*deploy*" -o -iname "*moones*lock*" -o -iname "*mones*lock*" \) -mmin -240 -printf "%p|%TY-%Tm-%TdT%TH:%TM:%TS|%s bytes\n" 2>/dev/null | head -50 || true
          '
