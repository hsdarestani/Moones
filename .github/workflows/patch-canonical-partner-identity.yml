name: Patch canonical partner identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-partner-identity-anchor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply canonical identity architecture patch
        run: python .github/scripts/patch_canonical_identity_anchor.py
      - name: Compile and run identity/image regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile app/services/partner_identity_anchor.py app/services/image_pipeline_v2.py app/services/image_generation_service.py app/services/image_prompt_engine.py
          pytest -q \
            tests/test_partner_identity_anchor.py \
            tests/test_krea_adult_generation_plan.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_partner_photo_engine.py \
            tests/test_split_panel_collage_rejection.py \
            -k 'not test_partner_photo_messages_are_human_not_queue_copy'
      - name: Commit permanent product changes
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/scripts/patch_canonical_identity_anchor.py
          rm -f .github/workflows/patch-canonical-partner-identity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/partner_identity_anchor.py app/services/image_pipeline_v2.py app/services/image_generation_service.py app/services/image_prompt_engine.py tests/test_partner_identity_anchor.py
          git add -u .github/scripts/patch_canonical_identity_anchor.py .github/workflows/patch-canonical-partner-identity.yml
          git diff --cached --check
          git commit -m 'Preserve canonical partner identity across profile and context edits'
          git push origin HEAD:agent/canonical-partner-identity-anchor
