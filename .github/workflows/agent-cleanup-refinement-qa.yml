name: Agent cleanup refinement QA

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/refinement-qa-delivery-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Remove temporary agent files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f \
            .github/scripts/patch_refinement_qa_delivery_identity.py \
            .github/workflows/agent-refinement-qa-delivery-identity.yml \
            .github/workflows/agent-cleanup-refinement-qa.yml
          git add -A .github
          if git diff --cached --quiet; then
            echo 'No temporary files remain'
          else
            git commit -m 'Remove temporary refinement validation files'
            git push origin HEAD:${{ github.head_ref }}
          fi
