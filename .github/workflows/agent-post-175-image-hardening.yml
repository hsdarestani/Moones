name: Agent post-175 image hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/harden-image-contracts-after-175'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply reviewed hardening
        run: |
          set -euo pipefail
          if grep -q 'IMAGE_RELATIVE_PREVIOUS_REFERENCE_LOCKED' app/services/semantic_image_intent_router.py; then
            echo 'Product hardening already applied'
          else
            python .github/scripts/patch_post_175_image_hardening.py
          fi
      - name: Compile
        run: |
          set -euo pipefail
          python -B -m py_compile \
            app/services/semantic_image_intent_router.py \
            app/services/image_pipeline_v2.py \
            app/services/generated_image_qa_service.py \
            app/api/telegram.py \
            app/services/image_generation_service.py \
            app/services/image_generation_guardrails.py
      - name: Provider-free regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_post_175_image_hardening.py \
            tests/test_image_contract_regressions.py \
            tests/test_image_generation_jobs.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_explicit_selfie_routing.py \
            tests/test_image_qa_latency_status.py \
            tests/test_image_visual_state.py
      - name: Diff check
        run: |
          set -euo pipefail
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git add app tests
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'Harden image QA fallback and previous-image binding'
            git push origin HEAD:${{ github.head_ref }}
          fi
