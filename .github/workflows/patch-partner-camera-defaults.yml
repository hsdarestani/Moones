name: Patch partner camera defaults

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-partner-camera-defaults
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact camera-default patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/services/partner_photo_contract.py')
          text = p.read_text()
          old = '''    camera_mode: str = "casual_phone_photo"\n    framing: str = "natural_medium_or_medium_wide"\n'''
          new = '''    camera_mode: str = "casual_phone_photo"\n    framing: str = "natural_medium_or_medium_wide"\n    camera_explicit_current_request: bool = False\n    framing_explicit_current_request: bool = False\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    framing = str(_value(visual_intent, "framing", None) or "").strip().lower()\n    camera = normalize_camera_mode(_value(visual_intent, "camera_mode", None) or _value(visual_intent, "camera", None))\n    if hands_only or object_only or pet_only:\n        camera = camera or "point_of_view"\n        framing = framing or "detail"\n    elif back_to_camera:\n        camera = camera or "tripod_timer"\n        framing = framing or "natural_medium_or_medium_wide"\n    elif framing == "full_body" and camera in {None, "casual_selfie"}:\n        # A true arm-length full-body selfie is usually implausible. A mirror or timer is natural.\n        camera = "mirror_selfie"\n    else:\n        camera = camera or ("casual_selfie" if primary_subject == "partner" and partner_visible else "casual_phone_photo")\n        framing = framing or "natural_medium_or_medium_wide"\n'''
          new = '''    framing = str(_value(visual_intent, "framing", None) or "").strip().lower()\n    camera = normalize_camera_mode(_value(visual_intent, "camera_mode", None) or _value(visual_intent, "camera", None))\n    camera_explicit = bool(_value(visual_intent, "camera_explicit_current_request", False))\n    framing_explicit = bool(_value(visual_intent, "framing_explicit_current_request", False))\n    if hands_only or object_only or pet_only:\n        camera = camera or "point_of_view"\n        framing = framing or "detail"\n    elif back_to_camera:\n        camera = camera or "tripod_timer"\n        framing = framing or "natural_medium_or_medium_wide"\n    elif primary_subject == "partner" and partner_visible and not camera_explicit:\n        # Asking for a photo of the partner is not the same as asking for a selfie.\n        # For a full-body photo, a timer/tripod is the natural default and avoids\n        # inventing a mirror in scenes where no mirror was requested.\n        camera = "tripod_timer" if framing == "full_body" else "casual_phone_photo"\n        framing = framing or "natural_medium_or_medium_wide"\n    else:\n        camera = camera or "casual_phone_photo"\n        framing = framing or "natural_medium_or_medium_wide"\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        camera_mode=camera,\n        framing=framing,\n        required_body_regions=required_regions,\n'''
          new = '''        camera_mode=camera,\n        framing=framing,\n        camera_explicit_current_request=camera_explicit,\n        framing_explicit_current_request=framing_explicit,\n        required_body_regions=required_regions,\n'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('app/services/image_pipeline_v2.py')
          text = p.read_text()
          old = '''    camera_mode=contract.get('camera_mode') or intent.composition.camera or ('casual_selfie' if contract.get('partner_visible', True) and not contract.get('object_only') and not contract.get('pet_only') and not contract.get('hands_only') else 'casual_phone_photo')\n    requested_framing=contract.get('framing') or intent.composition.framing\n'''
          new = '''    requested_framing=contract.get('framing') or intent.composition.framing\n    camera_mode=contract.get('camera_mode') or intent.composition.camera\n    if not camera_mode:\n        camera_mode = ('tripod_timer' if requested_framing == 'full_body' and contract.get('partner_visible', True) and not contract.get('object_only') and not contract.get('pet_only') and not contract.get('hands_only') else 'casual_phone_photo')\n    elif camera_mode == 'casual_selfie' and requested_framing == 'full_body' and not bool(contract.get('camera_explicit_current_request')):\n        camera_mode = 'tripod_timer'\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        if vr.camera_mode == 'casual_selfie' and not bool(contract.get('camera_explicit_current_request')):\n            vr.camera_mode='mirror_selfie'; contract['camera_mode']='mirror_selfie'; vr.photo_contract=contract\n            vr.reason_codes.append('full_body_mirror_selfie_required')\n'''
          new = '''        if vr.camera_mode == 'casual_selfie' and not bool(contract.get('camera_explicit_current_request')):\n            vr.camera_mode='tripod_timer'; contract['camera_mode']='tripod_timer'; vr.photo_contract=contract\n            vr.reason_codes.append('full_body_timer_camera_inferred')\n'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Test camera and image runtime contracts
        run: |
          set -euo pipefail
          pip install -r requirements.txt >/dev/null
          python -m py_compile app/services/partner_photo_contract.py app/services/image_pipeline_v2.py app/services/image_generation_runtime.py
          pytest -q \
            tests/test_partner_camera_defaults.py \
            tests/test_partner_foreground_prop_advisory.py \
            tests/test_generic_partner_runtime_resilience.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_krea_adult_generation_plan.py
      - name: Commit source patch back to branch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'PATCH_ALREADY_APPLIED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/partner_photo_contract.py app/services/image_pipeline_v2.py
          git commit -m 'Fix inferred selfie camera defaults for partner photos'
          git push origin HEAD:agent/fix-partner-camera-defaults
