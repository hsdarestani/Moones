name: Read production image job diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: moones-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.head_ref == 'ops/read-http-image-job-diagnostic-49970af'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/moones_diag"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/moones_diag" "$HOME/.ssh/known_hosts"

      - name: Deploy diagnostic endpoint
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: 49970afaa83893eed2d960e93d50d7886fdc3a97
        run: |
          set -euo pipefail
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          ssh \
            -i "$HOME/.ssh/moones_diag" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -p "$port" \
            "$user@$PROD_HOST" \
            "deploy $TARGET_SHA"

      - name: Read safe production job metadata
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          token='moones-jobdiag-20260730-4f3c8d9a7b2e61'
          path='/ops/image-jobs-4f3c8d9a7b2e61'
          host="${PROD_HOST#http://}"
          host="${host#https://}"
          host="${host%%/*}"
          success=0
          for url in "https://${host}${path}" "http://${host}${path}"; do
            echo "TRY_URL=${url%%/ops/*}/ops/..."
            if curl -ksSf --connect-timeout 10 --max-time 25 -H "x-ops-token: $token" "$url" -o image-jobs.json; then
              success=1
              break
            fi
          done
          test "$success" -eq 1
          python - <<'PY'
          import json
          data=json.load(open('image-jobs.json'))
          print('OPS_HTTP_IMAGE_JOBS='+json.dumps(data, ensure_ascii=False, sort_keys=True))
          PY
