name: Agent image acceptance regressions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/image-acceptance-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply patch
        run: |
          set -euo pipefail
          if test -f tests/test_image_acceptance_regressions.py; then
            echo 'Product patch already applied'
          else
            python .github/scripts/prepatch_source_context.py
            python .github/scripts/patch_image_acceptance_regressions.py
          fi
      - name: Compile
        run: |
          set -euo pipefail
          python -B -m py_compile \
            app/api/telegram.py \
            app/services/semantic_image_intent_router.py \
            app/services/semantic_image_router_context.py \
            app/services/image_pipeline_v2.py \
            app/services/image_generation_guardrails.py \
            app/services/image_generation_service.py
      - name: Focused tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_image_acceptance_regressions.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_image_generation_jobs.py \
            tests/test_remove_new_vs_edit_clarification.py \
            tests/test_explicit_selfie_routing.py \
            tests/test_image_provider_failover.py
      - name: Diff and cleanup check
        run: |
          set -euo pipefail
          test ! -e app/ops_main.py
          test ! -e app/api/ops_image_acceptance_diagnostic.py
          grep -q 'app.main:app' Dockerfile
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git add Dockerfile app tests
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'Fix image acceptance routing, continuity, and adult intent'
            git push origin HEAD:${{ github.head_ref }}
          fi
