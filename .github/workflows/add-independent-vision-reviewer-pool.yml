name: Add independent Vision reviewer pool

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-independent-vision-reviewer-pool
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply reviewer-pool patch
        run: |
          python .github/scripts/patch_vision_reviewer_pool.py
          python .github/scripts/adjust_reviewer_pool_metadata_contract.py
      - name: Compile and test complete reviewer path
        run: |
          python -m py_compile \
            app/core/config.py \
            app/services/generated_image_qa_service.py \
            tests/test_independent_vision_reviewer_pool.py \
            conftest.py
          pytest -q \
            tests/test_independent_vision_reviewer_pool.py \
            tests/test_vision_response_format_fallback.py \
            tests/test_resilient_vision_qa_transport.py \
            tests/test_krea_provider_prompt_limit.py \
            tests/test_krea_adult_generation_plan.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_lustify_provider_prompt_limit.py \
            tests/test_image_provider_failover.py \
            tests/test_nude_anatomy_profile_migration.py \
            tests/test_issue_180_image_failure_retry.py \
            tests/test_semantic_image_intent_router.py
          git diff --check
      - name: Commit product changes
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/scripts/patch_vision_reviewer_pool.py
          rm -f .github/scripts/adjust_reviewer_pool_metadata_contract.py
          rm -f .github/workflows/add-independent-vision-reviewer-pool.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/services/generated_image_qa_service.py \
            tests/test_independent_vision_reviewer_pool.py
          git commit -m "Use independent Vision reviewer pool for image QA"
          git push origin HEAD:agent/add-independent-vision-reviewer-pool
