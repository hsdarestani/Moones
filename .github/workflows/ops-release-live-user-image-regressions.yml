name: OPS release live user image regressions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-release-live-user-image-regressions.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a86be4b6f086ac3d5dabbfd896ed6265a4be5e77
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused preflight
        run: |
          set -euo pipefail
          pip install -r requirements.txt >/dev/null
          python -m py_compile \
            app/services/image_generation_runtime.py \
            app/services/partner_image_quality_policy.py \
            app/services/image_pipeline_v2.py \
            app/services/generated_image_qa_service.py
          pytest -q \
            tests/test_live_user_image_regressions.py \
            tests/test_partner_scene_face_quality.py \
            tests/test_partner_foreground_prop_advisory.py \
            tests/test_explicit_mirror_camera_intent.py \
            tests/test_partner_camera_defaults.py \
            tests/test_generic_partner_runtime_resilience.py \
            tests/test_partner_identity_anchor.py
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/moones_release"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/moones_release" "$HOME/.ssh/known_hosts"
      - name: Deploy exact clean main SHA and verify health
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: a86be4b6f086ac3d5dabbfd896ed6265a4be5e77
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          ssh -i "$HOME/.ssh/moones_release" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            -p "$port" "$user@$PROD_HOST" "deploy $TARGET_SHA" > release.log 2>&1
          cat release.log
          grep -q "DEPLOY_OK sha=$TARGET_SHA" release.log
          grep -q '"status":"ok"' release.log
          echo 'LIVE_USER_IMAGE_REGRESSION_RELEASE_OK'
