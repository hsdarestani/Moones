name: Patch Seedream corrective retry

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retry-seedream-unwanted-object
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply bounded Seedream retry patch
        run: python .github/scripts/patch_seedream_corrective_retry.py
      - name: Compile and test generation contract
        run: |
          python -m py_compile \
            app/core/config.py \
            app/services/image_generation_service.py \
            conftest.py
          pytest -q \
            tests/test_krea_adult_generation_plan.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_adult_generation_policy_contract.py \
            tests/test_split_panel_collage_rejection.py \
            tests/test_krea_provider_prompt_limit.py \
            tests/test_image_provider_failover.py \
            tests/test_nude_anatomy_profile_migration.py \
            tests/test_live_gate_uses_production_reviewer_pool.py
          git diff --check
      - name: Commit permanent product changes
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/scripts/patch_seedream_corrective_retry.py
          rm -f .github/workflows/patch-seedream-corrective-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/core/config.py \
            app/services/image_generation_service.py \
            conftest.py \
            tests/test_krea_adult_generation_plan.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_adult_generation_policy_contract.py
          git commit -m "Retry Seedream once for correctable adult image QA failures"
          git push origin HEAD:agent/retry-seedream-unwanted-object
