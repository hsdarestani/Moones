name: Compare image regressions for identity anchor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-partner-identity-anchor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compare branch failures with current main
        shell: bash
        run: |
          set -uo pipefail
          collect_tests() {
            find tests -maxdepth 1 -type f \( \
              -name 'test_*image*.py' -o \
              -name 'test_krea*.py' -o \
              -name 'test_partner_photo*.py' -o \
              -name 'test_*visual*.py' \
            \) -print | sort -u
            test -f tests/test_partner_identity_anchor.py && echo tests/test_partner_identity_anchor.py || true
          }
          run_suite() {
            local label="$1"
            mapfile -t files < <(collect_tests)
            echo "${label}_FILES=${#files[@]}"
            set +e
            pytest -q "${files[@]}" > "/tmp/${label}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/${label}.log"
            grep '^FAILED ' "/tmp/${label}.log" | sed -E 's/^FAILED ([^ ]+).*/\1/' | sort -u > "/tmp/${label}.failures" || true
            echo "${label}_STATUS=$status"
            echo "${label}_FAILURES=$(wc -l < /tmp/${label}.failures)"
          }

          set -e
          run_suite branch
          git checkout --force origin/main
          run_suite main
          echo '--- branch failures ---'; cat /tmp/branch.failures || true
          echo '--- main failures ---'; cat /tmp/main.failures || true
          comm -23 /tmp/branch.failures /tmp/main.failures > /tmp/new.failures
          echo '--- new branch-only failures ---'; cat /tmp/new.failures || true
          test ! -s /tmp/new.failures
