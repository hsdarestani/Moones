name: Partner image regressions

on:
  pull_request:
    paths:
      - 'app/services/image_generation_runtime.py'
      - 'app/services/partner_image_quality_policy.py'
      - 'tests/test_partner_scene_face_quality.py'
      - 'tests/test_partner_foreground_prop_advisory.py'
      - 'tests/test_partner_camera_defaults.py'
      - 'tests/test_explicit_mirror_camera_intent.py'
      - '.github/workflows/partner-image-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-partner-image-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed modules
        run: |
          python -m py_compile \
            app/services/image_generation_runtime.py \
            app/services/partner_image_quality_policy.py
      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_partner_scene_face_quality.py \
            tests/test_partner_foreground_prop_advisory.py \
            tests/test_partner_camera_defaults.py \
            tests/test_explicit_mirror_camera_intent.py
