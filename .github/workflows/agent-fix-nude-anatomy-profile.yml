name: Agent nude anatomy profile fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/fix-nude-anatomy-profile-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply anatomy migration fix
        run: |
          set -euo pipefail
          python .github/scripts/patch_nude_anatomy_profile_migration.py
      - name: Compile affected modules
        run: |
          set -euo pipefail
          python -B -m py_compile \
            app/services/image_pipeline_v2.py \
            app/services/image_prompt_engine.py \
            app/api/telegram.py \
            tests/test_nude_anatomy_profile_migration.py
      - name: Provider-free regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_nude_anatomy_profile_migration.py \
            tests/test_post_175_image_hardening.py \
            tests/test_image_contract_regressions.py \
            tests/test_image_generation_jobs.py \
            tests/test_semantic_image_intent_router.py
      - name: Diff check and cleanup
        run: |
          set -euo pipefail
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          rm -f .github/scripts/patch_nude_anatomy_profile_migration.py
          rm -f .github/workflows/agent-fix-nude-anatomy-profile.yml
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app tests .github
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'Fix nude anatomy profile migration'
            git push origin HEAD:${{ github.head_ref }}
          fi
