name: One-time pitch mobile fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time pitch mobile fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch pitch deck
        run: python scripts/one_time_pitch_mobile_fix.py
      - name: Commit final pitch fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one_time_pitch_mobile_fix.py .github/workflows/one-time-pitch-mobile-fix.yml
          git add app/static/pitch.html
          git commit -m "Fix mobile deck scrolling and add acquisition context"
          git push origin HEAD:main
