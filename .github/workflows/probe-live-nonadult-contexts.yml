name: Probe live nonadult arbitrary contexts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: Live Venice probe exact nonadult contexts and rollback
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/moones_probe"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/moones_probe" "$HOME/.ssh/known_hosts"
      - name: Run temporary live probe through protected deploy wrapper
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          ssh -i "$HOME/.ssh/moones_probe" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p "$port" "$user@$PROD_HOST" "deploy $TARGET_SHA" > live-nonadult-context-probe.log 2>&1
          rc=$?
          cat live-nonadult-context-probe.log
          echo "PROBE_DEPLOY_EXIT=$rc"
          # The probe deliberately exits nonzero after LIVE_NONADULT_CONTEXT_SMOKE_OK
          # so the server restores the clean production SHA. Preserve the log as
          # the source of truth rather than treating the expected rollback as a
          # GitHub Actions transport failure.
          exit 0
