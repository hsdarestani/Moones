name: OPS verify image model routing

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/services/image_model_routing_policy.py'
      - 'app/main.py'
      - 'tests/test_image_model_routing_policy.py'
      - '.github/workflows/ops-verify-image-model-routing.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile routing modules
        run: |
          python -m py_compile app/services/image_model_routing_policy.py app/main.py
      - name: Assert pytest has no paid provider hook
        run: |
          ! grep -q 'pytest_sessionstart' conftest.py
          ! grep -q 'VeniceImageClient' conftest.py
      - name: Run model routing regressions
        run: |
          pytest -q tests/test_image_model_routing_policy.py tests/test_partner_camera_defaults.py tests/test_live_user_image_regressions.py
