name: Agent refinement QA delivery identity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/refinement-qa-delivery-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply product fix and remove diagnostics
        run: |
          set -euo pipefail
          if grep -q 'contextual previous-image refinement' app/services/semantic_image_intent_router.py; then
            echo 'Patch already applied'
          else
            python .github/scripts/patch_refinement_qa_delivery_identity.py
          fi
      - name: Strict validation
        run: |
          set -euo pipefail
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          python -B -m py_compile \
            app/services/semantic_image_intent_router.py \
            app/services/generated_image_qa_service.py \
            app/services/partner_photo_contract.py \
            app/api/telegram.py \
            app/services/image_generation_service.py
          pytest -q \
            tests/test_refinement_qa_delivery_contract.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_remove_new_vs_edit_clarification.py \
            tests/test_image_generation_jobs.py \
            tests/test_image_qa_latency_status.py \
            tests/test_explicit_selfie_routing.py
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Commit clean product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git add Dockerfile app tests conftest.py
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'Fix previous-image refinement and degraded QA delivery'
            git push origin HEAD:${{ github.head_ref }}
          fi
