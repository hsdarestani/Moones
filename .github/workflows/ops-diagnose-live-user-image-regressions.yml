name: OPS verify live image regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/services/image_generation_runtime.py'
      - 'app/services/partner_image_quality_policy.py'
      - 'tests/test_live_user_image_regressions.py'
      - 'tests/test_partner_scene_face_quality.py'
      - 'tests/test_partner_foreground_prop_advisory.py'
      - 'tests/test_explicit_mirror_camera_intent.py'
      - '.github/workflows/ops-diagnose-live-user-image-regressions.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed modules
        run: |
          python -m py_compile \
            app/services/image_generation_runtime.py \
            app/services/partner_image_quality_policy.py
      - name: Run user reproductions and focused image regressions
        run: |
          pytest -q \
            tests/test_live_user_image_regressions.py \
            tests/test_partner_scene_face_quality.py \
            tests/test_partner_foreground_prop_advisory.py \
            tests/test_explicit_mirror_camera_intent.py \
            tests/test_partner_camera_defaults.py \
            tests/test_generic_partner_runtime_resilience.py \
            tests/test_partner_identity_anchor.py
