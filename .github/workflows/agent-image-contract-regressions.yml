name: Agent image contract regressions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    if: github.head_ref == 'fix/adult-scene-status-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply patch
        run: |
          set -euo pipefail
          if grep -q 'requested_nudity_missing' app/services/generated_image_qa_service.py; then
            echo 'Product patch already applied'
          else
            python .github/scripts/patch_image_contract_regressions.py
          fi
      - name: Compile
        run: |
          set -euo pipefail
          python -B -m py_compile \
            app/services/image_generation_guardrails.py \
            app/services/image_generation_service.py \
            app/services/image_pipeline_v2.py \
            app/services/generated_image_qa_service.py \
            app/services/semantic_image_intent_router.py \
            app/api/telegram.py
      - name: Focused tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_image_contract_regressions.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_image_generation_jobs.py \
            tests/test_explicit_selfie_routing.py \
            tests/test_remove_new_vs_edit_clarification.py
      - name: Diff check
        run: |
          set -euo pipefail
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git add app tests
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'Fix adult image fulfillment and status routing contracts'
            git push origin HEAD:${{ github.head_ref }}
          fi
