name: TRUSTED final exact nonadult gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  statuses: write

concurrency:
  group: moones-trusted-exact-nonadult-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # SECURITY: never checkout or execute PR head in this secrets-bearing job.
      # On pull_request_target, github.sha is the trusted base/main commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt >/dev/null
      - name: Focused preflight on trusted base only
        run: |
          set -euo pipefail
          python -m py_compile app/services/image_generation_runtime.py
          pytest -q \
            tests/test_generic_nonadult_classification_and_age_overlay.py \
            tests/test_generic_partner_runtime_resilience.py \
            tests/test_krea_adult_generation_plan.py \
            tests/test_krea_adult_worker_delivery.py
          touch /tmp/moones_preflight_ok
      - name: Detect probe mode
        run: |
          if [ -f app/services/live_nonadult_context_probe.py ] && grep -q 'run_live_nonadult_context_probe_if_configured' tests/conftest.py; then
            echo 'PROBE_MODE=1' >> "$GITHUB_ENV"
          else
            echo 'PROBE_MODE=0' >> "$GITHUB_ENV"
          fi
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/moones_gate"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/moones_gate" "$HOME/.ssh/known_hosts"
          touch /tmp/moones_ssh_ok
      - name: Protected probe or clean deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          set +e
          ssh -i "$HOME/.ssh/moones_gate" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            -p "$port" "$user@$PROD_HOST" "deploy $TARGET_SHA" > gate.log 2>&1
          rc=$?
          set -e
          cat gate.log
          echo "DEPLOY_EXIT=$rc PROBE_MODE=$PROBE_MODE TARGET_SHA=$TARGET_SHA"
          if [ "$PROBE_MODE" = "1" ]; then
            grep -q 'LIVE_NONADULT_CONTEXT_SMOKE_OK' gate.log
            grep -q 'ROLLBACK_TO=' gate.log
            test "$rc" -ne 0
            echo 'EXACT_NONADULT_PROBE_PASSED_AND_ROLLED_BACK'
          else
            test "$rc" -eq 0
            grep -q "DEPLOY_OK sha=$TARGET_SHA" gate.log
            grep -q '"status":"ok"' gate.log
            echo 'CLEAN_NONADULT_RELEASE_DEPLOYED'
          fi
      - name: Send trusted gate status to GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          reason=unknown-failure
          state=failure
          description='Trusted exact nonadult gate failed'

          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            if [ "${PROBE_MODE:-}" = "1" ]; then
              reason=probe-passed
              description='Exact bookstore and rooftop probe passed'
            else
              reason=clean-deploy-passed
              description='Clean nonadult release deployed'
            fi
          elif [ ! -f /tmp/moones_preflight_ok ]; then
            reason=preflight-failed
          elif [ ! -f /tmp/moones_ssh_ok ]; then
            reason=ssh-secrets-failed
          elif [ -f gate.log ] && grep -q 'DEPLOY_ALREADY_RUNNING' gate.log; then
            reason=deploy-lock
          elif [ -f gate.log ] && grep -q 'LIVE_NONADULT_CONTEXT_FAILED label=bookstore' gate.log; then
            reason=bookstore-failed
          elif [ -f gate.log ] && grep -q 'LIVE_NONADULT_CONTEXT_FAILED label=rooftop' gate.log; then
            reason=rooftop-failed
          elif [ -f gate.log ] && grep -q 'DEPLOY_SHA_MISMATCH' gate.log; then
            reason=sha-mismatch
          elif [ -f gate.log ] && grep -q 'LIVE_NONADULT_CONTEXT_SMOKE_OK' gate.log; then
            reason=post-probe-validation-failed
          else
            reason=deploy-or-probe-failed
          fi

          context="trusted-final-exact-nonadult/$reason"
          payload=$(python -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "$state" "$context" "$description")
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -d "$payload" >/dev/null
