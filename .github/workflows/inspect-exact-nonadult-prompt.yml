name: Inspect exact nonadult prompt markers

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b95659c5797376c83bbf999863d73aaf66f5b79
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt >/dev/null
      - name: Compile exact requests and print safe markers only
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from app.services import image_generation_runtime
          from app.services import image_pipeline_v2 as v2
          from app.llm.image_client import VENICE_SEED_MIN, adapt_provider_prompts

          class DummyDB:
              def flush(self): pass

          user=SimpleNamespace(partner_gender='دختر',partner_name='مهناز',partner_age_range='18-20')
          profile=SimpleNamespace(profile_json={},anatomical_profile='female',gender_presentation='feminine',base_seed=VENICE_SEED_MIN,user_id=1,version=3,partner_name='مهناز',fictional_age=18,face_description='oval face, softly defined jawline, natural facial proportions',hair_description='dark shoulder-length hair with a natural hairline',eye_description='dark almond-shaped eyes and natural eyebrows',skin_description='olive skin with natural texture',body_description='average adult feminine build with natural proportions',height_impression='average height',distinguishing_details='natural eyebrows',updated_at=None)
          profile=v2.ensure_visual_profile_v2(DummyDB(),user,profile)
          requests=[
            ('bookstore','یه عکس از خودت بده که وسط یه کتاب‌فروشی قدیمی بین قفسه‌ها ایستادی، یه پلیور طوسی گشاد پوشیدی و داری یه کتاب رو ورق می‌زنی.'),
            ('rooftop','حالا یه عکس تمام‌قد از خودت روی پشت‌بوم یه ساختمون شب، باد موهاتو به‌هم زده، لباس مشکی رسمی پوشیدی و چراغ‌های شهر پشت سرت معلومه.'),
          ]
          markers=['adult anatomy consistency:','anatomical profile','contradictory anatomy','mixed sex characteristics inconsistent with profile','malformed anatomy','ambiguous anatomy','anatomically inconsistent body','explicit nudity','fully nude','nude body','genitals','child','children','minor','minors','teen','teenager','youth','young-looking','underage','age 18','fictional age 18','18-year-old','18 year old','lingerie','underwear','shirtless']
          def hits(value):
              low=(value or '').lower()
              return [m for m in markers if m in low]
          for idx,(label,text) in enumerate(requests,1):
              intent=v2.parse_image_intent(v2.normalize_request_v2(text))
              merged=v2.merge_image_intent(intent,recent_context=[],memory_context=[],routine_context={})
              plan=v2.construct_resolved_plan(intent,merged,v2.SafetyDecision(),profile,message_id=8000+idx,user_request=text)
              compiled=v2.compile_image_prompt(plan)
              krea_p,krea_n,krea_meta=adapt_provider_prompts('krea-2-turbo',compiled.positive_prompt,compiled.negative_prompt)
              seed_p,seed_n,seed_meta=adapt_provider_prompts('seedream-v5-lite',compiled.positive_prompt,compiled.negative_prompt)
              print({
                'label':label,
                'classification':str(plan.current_intent.get('content_classification')),
                'intent_classification':str(intent.content_classification),
                'scene_key':getattr(intent.scene,'scene_key',None),
                'location':getattr(intent.scene,'location',None),
                'framing':plan.composition.get('framing'),
                'body_visibility_keys':sorted(plan.body_visibility.keys()),
                'explicit_nudity_requested':plan.visual_requirements.explicit_nudity_requested,
                'anatomy_qa_required':plan.visual_requirements.anatomy_qa_required,
                'compiled_positive_chars':len(compiled.positive_prompt),
                'compiled_negative_chars':len(compiled.negative_prompt),
                'compiled_positive_marker_hits':hits(compiled.positive_prompt),
                'compiled_negative_marker_hits':hits(compiled.negative_prompt),
                'krea_positive_chars':len(krea_p),
                'krea_negative_chars':len(krea_n),
                'krea_positive_marker_hits':hits(krea_p),
                'krea_negative_marker_hits':hits(krea_n),
                'krea_compacted':krea_meta['provider_prompt_compacted'],
                'seedream_positive_marker_hits':hits(seed_p),
                'seedream_negative_marker_hits':hits(seed_n),
                'identity_lock_present':'canonical identity lock' in compiled.positive_prompt.lower(),
                'canonical_visual_identity_present':'canonical visual identity' in compiled.positive_prompt.lower(),
              })
          PY
