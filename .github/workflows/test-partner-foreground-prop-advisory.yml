name: Test partner foreground prop advisory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt >/dev/null
      - name: Focused image runtime regression tests
        run: |
          set -euo pipefail
          python -m py_compile app/services/image_generation_runtime.py
          pytest -q \
            tests/test_partner_foreground_prop_advisory.py \
            tests/test_generic_partner_runtime_resilience.py \
            tests/test_krea_adult_worker_delivery.py \
            tests/test_krea_adult_generation_plan.py
