name: Harden issue 180 retry scope

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  harden-test-commit:
    if: github.head_ref == 'agent/fix-image-failure-retry-180'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply retry-scope hardening
        run: |
          set -euo pipefail
          python .github/scripts/harden_issue_180_retry_scope.py
      - name: Compile and test
        run: |
          set -euo pipefail
          python -B -m py_compile \
            app/services/semantic_image_intent_router.py \
            app/services/semantic_image_router_context.py \
            app/api/telegram.py \
            app/engine/simple_chat.py
          pytest -q \
            tests/test_issue_180_image_failure_retry.py \
            tests/test_post_175_image_hardening.py \
            tests/test_image_contract_regressions.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_image_generation_jobs.py
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Remove temporary automation and commit
        run: |
          set -euo pipefail
          rm -f .github/scripts/harden_issue_180_retry_scope.py
          rm -f .github/workflows/harden-issue-180-retry-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden failed image retry scope'
          git push origin HEAD:${{ github.head_ref }}
