name: Agent issue 180 image retry fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/fix-image-failure-retry-180'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply issue 180 fix
        run: |
          set -euo pipefail
          python .github/scripts/patch_issue_180_image_retry.py
      - name: Compile affected modules
        run: |
          set -euo pipefail
          python -B -m py_compile \
            app/services/semantic_image_intent_router.py \
            app/services/semantic_image_router_context.py \
            app/api/telegram.py \
            app/engine/simple_chat.py
      - name: Provider-free regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_issue_180_image_failure_retry.py \
            tests/test_post_175_image_hardening.py \
            tests/test_image_contract_regressions.py \
            tests/test_semantic_image_intent_router.py \
            tests/test_image_generation_jobs.py
      - name: Diff and temporary-file cleanup
        run: |
          set -euo pipefail
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          rm -f .github/scripts/patch_issue_180_image_retry.py
          rm -f .github/workflows/agent-issue-180-image-retry.yml
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix failed image contract retry and chat grounding'
          git push origin HEAD:${{ github.head_ref }}
