name: Patch live gate reviewer error details

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retain-safe-reviewer-provider-errors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/patch_live_gate_reviewer_error_details.py
      - name: Compile and test
        run: |
          python -m py_compile conftest.py app/services/generated_image_qa_service.py
          pytest -q \
            tests/test_safe_reviewer_provider_errors.py \
            tests/test_live_gate_uses_production_reviewer_pool.py \
            tests/test_enforced_reviewer_order.py \
            tests/test_independent_vision_reviewer_pool.py
          git diff --check
      - name: Commit permanent changes
        run: |
          find app tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/scripts/patch_live_gate_reviewer_error_details.py
          rm -f .github/workflows/patch-live-gate-reviewer-error-details.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github conftest.py tests/test_live_gate_uses_production_reviewer_pool.py
          git commit -m "Report safe reviewer errors in live gate"
          git push origin HEAD:agent/retain-safe-reviewer-provider-errors
